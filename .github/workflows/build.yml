name: Build Volt Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-volt-native-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: https://cnb.cool/aizhuliren/volt-native
  SOURCE_REF: main
  SOURCE_EXPECTED_COMMIT: fc8b1a1bb19f189fba6f7c04910265723259c9c0
  NODE_VERSION: "24"
  BUN_VERSION: "1.3.14"
  ZIG_VERSION: "0.16.0"

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v5

      - name: Checkout source main
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CNB_TOKEN"
          SOURCE_DIR="$RUNNER_TEMP/volt-native-source"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          git -c "http.extraHeader=Authorization: Bearer $CNB_TOKEN" clone \
            --branch "$SOURCE_REF" \
            --depth 1 \
            "$SOURCE_REPOSITORY" \
            "$SOURCE_DIR"
          git -C "$SOURCE_DIR" rev-parse HEAD

      - name: Apply verified SDK alignment patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_EXPECTED_COMMIT"
          git -C "$SOURCE_DIR" apply --check "$GITHUB_WORKSPACE/patches/volt-native-sdk-0.9.5-alignment.patch"
          git -C "$SOURCE_DIR" apply "$GITHUB_WORKSPACE/patches/volt-native-sdk-0.9.5-alignment.patch"
          rm -rf "$SOURCE_DIR/.git"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(zig version)" = "$ZIG_VERSION"
          cd "$SOURCE_DIR/native-ui"
          bun install --frozen-lockfile

      - name: Prefetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          cargo fetch --locked --target aarch64-apple-darwin

      - name: Prepare patched Native SDK
        shell: bash
        run: |
          set -euo pipefail
          VOLT_SOURCE_ROOT="$SOURCE_DIR" \
            VOLT_NATIVE_SDK_ALLOW_INVENTORY_PUBLISH=1 \
            ./scripts/prepare-native-sdk.sh --print-path
          grep -F '../.artifacts/native-sdk/0.9.5-patched' \
            "$SOURCE_DIR/native-ui/build.zig.zon"

      - name: Build macOS binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/native-ui"
          VOLT_NATIVE_SDK_REQUIRE_REUSE=1 \
            ../scripts/native-patched.sh build . --yes -Doptimize=ReleaseFast
          file zig-out/bin/volt-native-poc

      - name: Upload macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: volt-native-macos-arm64
          path: ${{ runner.temp }}/volt-native-source/native-ui/zig-out/bin/volt-native-poc
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 compile baseline
    runs-on: windows-2025
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v5

      - name: Checkout source main
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:CNB_TOKEN)) {
            throw "CNB_TOKEN is required"
          }
          $sourceDir = Join-Path $env:RUNNER_TEMP "volt-native-source"
          "SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git -c core.autocrlf=false -c "http.extraHeader=Authorization: Bearer $env:CNB_TOKEN" clone `
            --branch $env:SOURCE_REF `
            --depth 1 `
            $env:SOURCE_REPOSITORY `
            $sourceDir
          git -C $sourceDir config core.autocrlf false
          $sourceCommit = git -C $sourceDir rev-parse HEAD
          if ($sourceCommit -ne $env:SOURCE_EXPECTED_COMMIT) {
            throw "Expected source main $env:SOURCE_EXPECTED_COMMIT, got $sourceCommit"
          }
          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply verified patch stack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $alignment = Join-Path $env:GITHUB_WORKSPACE "patches/volt-native-sdk-0.9.5-alignment.patch"
          $windows = Join-Path $env:GITHUB_WORKSPACE "patches/volt-native-windows-compile-baseline.patch"
          git -C $env:SOURCE_DIR apply --check $alignment
          git -C $env:SOURCE_DIR apply $alignment
          git -C $env:SOURCE_DIR apply --check $windows
          git -C $env:SOURCE_DIR apply $windows
          Remove-Item -Recurse -Force "$env:SOURCE_DIR/.git"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location "$env:SOURCE_DIR/native-ui"
          bun install --frozen-lockfile
          node -e "const p=require('./node_modules/@native-sdk/cli-win32-x64/package.json'); if(p.version!=='0.9.5') process.exit(1)"
          if ((zig version).Trim() -ne $env:ZIG_VERSION) { throw "Unexpected Zig version" }

      - name: Prepare patched Native SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VOLT_SOURCE_ROOT = $env:SOURCE_DIR
          node "$env:GITHUB_WORKSPACE/scripts/prepare-native-sdk-windows.mjs"
          $sdkPath = Join-Path $env:SOURCE_DIR ".artifacts/native-sdk/0.9.5-patched"
          if (-not (Test-Path "$sdkPath/native-sdk-patch.json")) { throw "Windows overlay was not published" }
          "NATIVE_SDK_PATH=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node "$env:SOURCE_DIR/native-ui/node_modules/@native-sdk/cli/bin/native.js" --version

      - name: Build Windows PE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item -Recurse -Force "$env:SOURCE_DIR/native-ui/.zig-cache" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:SOURCE_DIR/native-ui/.native/build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:SOURCE_DIR/native-ui/.native/check" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:SOURCE_DIR/native-ui/zig-out" -ErrorAction SilentlyContinue
          Set-Location "$env:SOURCE_DIR/native-ui"
          node node_modules/@native-sdk/cli/bin/native.js test . --yes `
            -Dtarget=x86_64-windows-msvc `
            -Doptimize=ReleaseFast
          node node_modules/@native-sdk/cli/bin/native.js build . --yes `
            -Dtarget=x86_64-windows-msvc `
            -Doptimize=ReleaseFast
          node "$env:GITHUB_WORKSPACE/scripts/verify-windows-pe.mjs" `
            "$env:SOURCE_DIR/native-ui/zig-out/bin/volt-native-poc.exe"

      - name: Upload Windows PE
        uses: actions/upload-artifact@v7
        with:
          name: volt-native-windows-x64-compile-baseline
          path: ${{ runner.temp }}/volt-native-source/native-ui/zig-out/bin/volt-native-poc.exe
          if-no-files-found: error
          retention-days: 14
