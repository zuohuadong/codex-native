name: Build Pi Rust Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - pi-rust
  pull_request:
    branches:
      - main
      - pi-rust

permissions:
  contents: read

concurrency:
  group: build-pi-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --workspace --all-targets

      - name: Run Cargo Test
        run: cargo test --workspace

  build-macos:
    name: Build macOS Binary (arm64)
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Desktop Release
        run: cargo build --release -p pi-desktop

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-macos-arm64
          path: target/release/pi-desktop
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows Binary (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Desktop Release
        run: cargo build --release -p pi-desktop

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-windows-x64
          path: target/release/pi-desktop.exe
          if-no-files-found: error
          retention-days: 14
